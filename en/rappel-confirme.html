  <!-- Audit trafic Ads (uniquement visites gclid) -->
  <script>
  (function(){
    if(!/[?&](gclid|gbraid|wbraid|gad_source)=/.test(location.search)) return;
    var id=Date.now().toString(36)+Math.random().toString(36).slice(2,8);
    function send(type,extra){
      var d={id:id,type:type,page:location.pathname,q:location.search.slice(0,300),ref:document.referrer,
        sw:screen.width,sh:screen.height,dpr:window.devicePixelRatio||1,
        touch:('ontouchstart' in window),wd:navigator.webdriver===true,
        lang:navigator.language||'',conc:navigator.hardwareConcurrency||0,
        tz:(function(){try{return Intl.DateTimeFormat().resolvedOptions().timeZone||''}catch(e){return ''}})()};
      for(var k in extra)d[k]=extra[k];
      try{navigator.sendBeacon('/api/track',JSON.stringify(d));}catch(e){}
    }
    send('start',{});
    var moves=0,scrolls=0,clics=0,telC=0,devC=0,maxSc=0,conv='',t0=Date.now(),fini=false;
    addEventListener('pointermove',function(){moves++},{passive:true});
    /* scrolls = nb d'evenements ; maxSc = profondeur reelle atteinte en % de la page */
    addEventListener('scroll',function(){scrolls++;
      var h=(document.documentElement.scrollHeight||0)-window.innerHeight;
      if(h>0){var p=Math.round((window.scrollY/h)*100); if(p>maxSc)maxSc=(p>100?100:p);}
    },{passive:true});
    /* Conversion : envoi d'un formulaire (devis en colonne, ou chat termine) */
    document.addEventListener('submit',function(e){
      var f=e.target;
      if(f&&f.tagName==='FORM'&&f.getAttribute('data-netlify')){
        conv='formulaire'; send('conv',{conv:'formulaire',form:f.getAttribute('name')||''});
      }
    },true);
    /* 'click' et non 'pointerdown' : sur mobile, chaque defilement commence par un toucher
       qui gonflait les compteurs (et comptait des faux clics tel/devis). Le vrai clic seul compte. */
    addEventListener('click',function(e){clics++;
      var a=e.target&&e.target.closest?e.target.closest('a'):null;
      if(a){var h=a.getAttribute('href')||'';
        if(h.indexOf('tel:')===0){telC++; if(conv!=='formulaire'){conv='appel'; send('conv',{conv:'appel'});}}
        else if(h.indexOf('demande-de-devis')>-1||a.className.indexOf('expert-strip__devis')>-1){devC++;}}
    },{passive:true});
    function fin(){ if(fini)return; fini=true; send('end',{dwell:Date.now()-t0,moves:moves,scrolls:scrolls,clics:clics,tel:telC,devis:devC,maxsc:maxSc,conv:conv}); }
    addEventListener('pagehide',fin);
    document.addEventListener('visibilitychange',function(){if(document.visibilityState==='hidden')fin();});
  })();
  </script>
